[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convolvex"
version = "1.1.0"
description = "Auditable, operator-based convolution and inverse-problem research workbench"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
legacy-ui-test = ["playwright>=1.48"]
report = ["matplotlib>=3.8", "pillow>=10"]
mcp-sdk-test = ["mcp>=1.26,<2"]
gpu = ["cupy-cuda12x>=13,<15"]

[project.scripts]
convolvex = "convolvex.cli:main"
convolvex-mcp = "convolvex.mcp_server:main"
convolvex-agent = "convolvex.agent_runner:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
convolvex = ["web/*", "_native/*", "data/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
