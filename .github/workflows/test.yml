name: numeric-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build optional native kernels
        if: runner.os != 'Windows'
        run: python scripts/build_native.py
      - name: Install source and official SDK test dependencies
        run: python -m pip install -c requirements-tested.txt ".[test]" "mcp==1.26.0"
      - run: python -m pytest -q -ra --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml
