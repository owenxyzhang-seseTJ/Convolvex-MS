<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Convolvex</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="/" aria-label="Convolvex"><span class="brand-mark"><i></i><i></i><i></i></span><span>Convolvex</span></a>
  <nav aria-label="工作区导航">
    <button class="nav active" data-view="workspace"><span>◫</span>工作台</button>
    <button class="nav" data-view="model"><span>◇</span>算子</button>
    <button class="nav" data-view="benchmarks"><span>↗</span>基准</button>
    <button class="nav" data-view="records"><span>▤</span>记录</button>
  </nav>
  <div class="sidebar-bottom"><button id="authButton" class="plain">访问令牌</button><div class="engine-status"><i id="onlineDot"></i><span id="onlineStatus">连接中</span></div><div class="version">1.0.0</div></div>
</aside>
<div class="shell">
<header class="topbar"><div class="breadcrumb">研究空间 <span>/</span> <b id="viewLabel">工作台</b></div><div class="top-actions"><button id="importButton">导入</button><button id="exportProject">保存项目</button><button id="exportResult">导出结果</button><button id="runButton" class="primary"><span>▶</span>运行</button></div></header>
<main>
<section id="workspace" class="view">
<div class="page-heading"><h1>卷积与反问题</h1><div class="tags"><span class="tag" id="modelTag">CONVOLUTION</span><span class="tag" id="sizeTag">480 × 1</span><span class="tag accent" id="dataTag">合成数据</span></div></div>
<div class="work-grid">
<aside class="controls">
<section class="panel stack controls-panel"><div class="panel-heading"><h2>数据</h2><span class="index">01</span></div>
<label>任务<select id="task"><option value="inverse">反卷积</option><option value="forward">正向卷积</option><option value="kernel">核估计</option><option value="blind">盲反卷积</option><option value="gcv">GCV</option><option value="bootstrap">Bootstrap</option></select></label>
<label>模拟实验<select id="demo"><option value="signal">一维瞬态信号</option><option value="image">二维图像恢复</option><option value="volume">三维体数据</option><option value="dems">多通道谱与传输</option><option value="baseline">信号与背景分离</option><option value="poisson">泊松计数</option></select></label>
<div class="button-row"><button id="loadDemo">载入实验</button><button id="editProject">JSON</button></div>
<div class="file-drop" id="dropZone" tabindex="0" role="button" aria-label="导入数据"><span class="file-icon">↥</span><b id="fileName">signal.json</b><span>JSON · CSV</span></div>
</section>
<section class="panel controls-panel"><div class="panel-heading"><h2>前向模型</h2><span class="index">02</span></div>
<label>输出支撑<select id="mode"><option value="causal">Causal</option><option value="full">Full</option><option value="same">Same</option><option value="valid">Valid</option><option value="circular">Circular</option></select></label>
<div class="two-col"><label>边界<select id="boundary"><option value="zero">Zero</option><option value="reflect">Reflect</option></select></label><label>计算引擎<select id="engine"><option value="fft">FFT · CPU</option><option value="cpp">C++ · CPU</option><option value="direct">Direct</option><option value="overlap_add">Overlap-add</option></select></label></div>
<label>采样体积<input id="sampleVolume" type="number" value="1" step="any" min="0.00000001"></label>
<div class="kernel-box"><div class="mini-heading"><span>核函数</span><button id="editKernel" class="plain">编辑</button></div><svg id="kernelPlot" aria-label="核函数图" viewBox="0 0 260 80"></svg></div>
</section>
<section class="panel controls-panel"><div class="panel-heading"><h2>求解</h2><span class="index">03</span></div>
<label>方法<select id="method"><option value="fista">FISTA</option><option value="tikhonov">Tikhonov · LSMR</option><option value="tv">TV · PDHG</option><option value="pars">PARS</option><option value="richardson_lucy">Richardson–Lucy</option><option value="wiener">Wiener</option><option value="gpu_fista">FISTA · GPU</option></select></label>
<div class="two-col"><label id="alphaLabel">λ₂ / λTV<input id="alpha" type="number" value="0.003" min="0" step="any"></label><label>λ₁<input id="l1" type="number" value="0.0008" min="0" step="any"></label></div>
<div class="two-col"><label>差分阶数<select id="order"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select></label><label>迭代上限<input id="iterations" type="number" value="1500" min="1" max="5000"></label></div>
<div class="two-col"><label>损失<select id="loss"><option value="gaussian">Gaussian</option><option value="huber">Huber</option></select></label><label>容差<input id="tolerance" type="number" value="0.000001" step="any"></label></div>
<label class="check"><input id="nonnegative" type="checkbox" checked><span>非负约束</span></label>
</section>
</aside>
<div class="analysis">
<div class="metrics"><section class="metric"><span>相对残差</span><strong id="residualMetric">—</strong></section><section class="metric"><span>迭代</span><strong id="iterationMetric">—</strong></section><section class="metric"><span>计算时间</span><strong id="timeMetric">—</strong></section><section class="metric"><span>状态</span><strong class="status-value" id="statusMetric">待运行</strong></section></div>
<section class="panel stack chart-main"><div class="panel-heading"><h2>观测与重构</h2><div class="chart-tools"><select id="imageLayer" class="hidden" aria-label="图像显示"><option value="observed">观测</option><option value="predicted">重构</option></select><label class="compact">通道<select id="channel"><option value="0">1</option></select></label><button id="resetZoom" class="plain">复位</button></div></div><div id="observedPlot" class="plot" role="img" aria-label="观测与重构"></div><div id="observedLegend" class="legend"></div></section>
<section class="panel source-panel"><div class="panel-heading"><h2>源信号</h2><div class="chart-tools"><select id="sourceLayer" class="hidden" aria-label="源图像显示"><option value="estimate">恢复</option><option value="truth">真值</option></select><label class="compact">分量<select id="sourceChannel"><option value="0">1</option></select></label></div></div><div id="sourcePlot" class="plot" role="img" aria-label="恢复源信号"></div><div id="sourceLegend" class="legend"></div></section>
<div class="lower-grid"><section class="panel"><div class="panel-heading"><h2>残差</h2><span class="notation">y − A x</span></div><div id="residualPlot" class="plot small" role="img" aria-label="残差"></div></section><section class="panel"><div class="panel-heading"><h2>收敛</h2><span class="notation">Φ(x)</span></div><div id="historyPlot" class="plot small" role="img" aria-label="目标函数"></div></section></div>
<section class="panel diagnostic"><div class="panel-heading"><h2>诊断</h2><button id="cancelButton" class="danger hidden">停止</button></div><div class="diagnostic-grid"><div><span>伴随误差</span><b id="adjointMetric">—</b></div><div><span>驻点残差</span><b id="stationarityMetric">—</b></div><div><span>输入指纹</span><b id="hashMetric">—</b></div></div><div id="warningBox" class="hidden"></div></section>
</div></div></section>
<section id="benchmarks" class="view hidden"><div class="page-heading"><h1>计算基准</h1><span class="tag" id="benchmarkHardware">CPU</span></div><section class="panel"><div class="panel-heading"><h2>执行时间</h2><span class="tag">FLOAT64</span></div><div id="benchmarkTable"></div></section><section class="panel benchmark-detail"><div class="panel-heading"><h2>运行环境</h2></div><pre id="benchmarkEnvironment"></pre></section></section>
<section id="records" class="view hidden"><div class="page-heading"><h1>计算记录</h1><button id="refreshRecords">刷新</button></div><section class="panel"><div id="recordsTable"></div></section></section>
</main>
<footer><span id="footerStatus">READY</span><span>FLOAT64 <i>·</i> LOCAL</span></footer>
</div>
<dialog id="editor"><form method="dialog"><div class="panel-heading"><h2 id="editorTitle">项目</h2><button class="plain" value="cancel" aria-label="关闭">✕</button></div><textarea id="editorText" spellcheck="false" aria-label="JSON编辑器"></textarea><div class="dialog-actions"><span id="editorError" role="alert"></span><button value="cancel">取消</button><button id="applyEditor" type="button" class="primary">应用</button></div></form></dialog>
<dialog id="csvDialog"><form method="dialog"><div class="panel-heading"><h2>CSV 数据</h2><button class="plain" aria-label="关闭">✕</button></div><label>观测列<select id="csvY"></select></label><label>时间列<select id="csvTime"></select></label><label>响应核<select id="csvKernel"></select></label><div class="dialog-actions"><button id="applyCSV" class="primary" type="button">导入</button></div></form></dialog>
<input type="file" id="fileInput" accept=".json,.csv" hidden>
<div id="toast" role="status" class="toast hidden"></div>
<script src="/assets/app.js" defer></script>
</body></html>
